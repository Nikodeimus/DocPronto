name: Desktop release

on:
  push:
    tags:
      - "lab-v*"
      - "v*"

permissions:
  contents: read

jobs:
  laboratory_build:
    if: startsWith(github.ref_name, 'lab-v')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Validate Laboratory tag and signing policy
        id: release
        run: node scripts/prepare-desktop-release.mjs --tag "${{ github.ref_name }}" --channel lab
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          DOCPRONTO_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
      - run: npm ci
      - run: npm test
      - run: npm run desktop:test
      - run: npm run desktop:package:lab:ci
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          DOCPRONTO_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
      - name: Generate release metadata and SHA-256
        shell: pwsh
        run: |
          [pscustomobject]@{
            channel = '${{ steps.release.outputs.feed }}'
            version = '${{ steps.release.outputs.version }}'
            tag = '${{ github.ref_name }}'
            commit = '${{ github.sha }}'
            prerelease = $true
            integrityMode = '${{ steps.release.outputs.integrity_mode }}'
            signed = [System.Convert]::ToBoolean('${{ steps.release.outputs.signed }}')
            publisherNames = ConvertFrom-Json '${{ steps.release.outputs.publisher_names }}'
          } | ConvertTo-Json | Set-Content release/lab/release-metadata.json -Encoding utf8
          $files = Get-ChildItem release/lab -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap', '.json' } | Where-Object { $_.Name -ne 'sha256.json' }
          $hashes = $files | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            [pscustomobject]@{ file = $_.Name; sha256 = $hash.Hash.ToLowerInvariant() }
          }
          $hashes | ConvertTo-Json | Set-Content release/lab/sha256.json -Encoding utf8
      - name: Stage Laboratory release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docpronto-laboratory-${{ github.sha }}
          path: |
            release/lab/*.exe
            release/lab/lab.yml
            release/lab/*.blockmap
            release/lab/sha256.json
            release/lab/release-metadata.json
          if-no-files-found: error
          retention-days: 1

  laboratory_publish:
    if: startsWith(github.ref_name, 'lab-v')
    needs: laboratory_build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Laboratory release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docpronto-laboratory-${{ github.sha }}
          path: release/lab
      - name: Verify downloaded SHA-256 manifest
        shell: pwsh
        run: |
          $directory = 'release/lab'
          $manifest = @(Get-Content release/lab/sha256.json -Raw | ConvertFrom-Json)
          if ($manifest.Count -eq 0) { throw 'SHA-256 manifest is empty.' }
          $manifestNames = @{}
          foreach ($entry in $manifest) {
            if ([IO.Path]::GetFileName($entry.file) -ne $entry.file -or $entry.sha256 -notmatch '^[0-9a-fA-F]{64}$') {
              throw 'SHA-256 manifest contains an invalid entry.'
            }
            if ($manifestNames.ContainsKey($entry.file)) { throw "Duplicate manifest entry: $($entry.file)." }
            $manifestNames[$entry.file] = $true
            $path = Join-Path $directory $entry.file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Manifest file is missing: $($entry.file)." }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $entry.sha256) { throw "SHA-256 mismatch: $($entry.file)." }
          }
          $payload = @(Get-ChildItem $directory -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap', '.json' } | Where-Object { $_.Name -ne 'sha256.json' })
          $differences = @(Compare-Object @($manifestNames.Keys | Sort-Object) @($payload.Name | Sort-Object))
          if ($differences.Count -ne 0) { throw 'Downloaded release payload differs from its SHA-256 manifest.' }
      - name: Publish Laboratory prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          files: |
            release/lab/*.exe
            release/lab/lab.yml
            release/lab/*.blockmap
            release/lab/sha256.json
            release/lab/release-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stable_build:
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Validate stable tag and require Authenticode
        id: release
        run: node scripts/prepare-desktop-release.mjs --tag "${{ github.ref_name }}" --channel stable --require-signed
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          DOCPRONTO_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
      - run: npm ci
      - run: npm test
      - run: npm run desktop:test
      - run: npm run desktop:package:stable:ci
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          DOCPRONTO_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
          DOCPRONTO_REQUIRE_SIGNED: "true"
      - name: Verify stable Authenticode signatures
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem release/stable -File -Filter *.exe)
          if ($executables.Count -eq 0) {
            throw 'Stable release produced no executable to verify.'
          }
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($executable.Name): $($signature.Status)."
            }
          }
      - name: Generate release metadata and SHA-256
        shell: pwsh
        run: |
          [pscustomobject]@{
            channel = '${{ steps.release.outputs.feed }}'
            version = '${{ steps.release.outputs.version }}'
            tag = '${{ github.ref_name }}'
            commit = '${{ github.sha }}'
            prerelease = $false
            integrityMode = '${{ steps.release.outputs.integrity_mode }}'
            signed = [System.Convert]::ToBoolean('${{ steps.release.outputs.signed }}')
            publisherNames = ConvertFrom-Json '${{ steps.release.outputs.publisher_names }}'
          } | ConvertTo-Json | Set-Content release/stable/release-metadata.json -Encoding utf8
          $files = Get-ChildItem release/stable -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap', '.json' } | Where-Object { $_.Name -ne 'sha256.json' }
          $hashes = $files | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            [pscustomobject]@{ file = $_.Name; sha256 = $hash.Hash.ToLowerInvariant() }
          }
          $hashes | ConvertTo-Json | Set-Content release/stable/sha256.json -Encoding utf8
      - name: Stage stable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docpronto-stable-${{ github.sha }}
          path: |
            release/stable/*.exe
            release/stable/latest.yml
            release/stable/*.blockmap
            release/stable/sha256.json
            release/stable/release-metadata.json
          if-no-files-found: error
          retention-days: 1

  stable_publish:
    if: ${{ startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    needs: stable_build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified stable release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docpronto-stable-${{ github.sha }}
          path: release/stable
      - name: Verify downloaded SHA-256 manifest
        shell: pwsh
        run: |
          $directory = 'release/stable'
          $manifest = @(Get-Content release/stable/sha256.json -Raw | ConvertFrom-Json)
          if ($manifest.Count -eq 0) { throw 'SHA-256 manifest is empty.' }
          $manifestNames = @{}
          foreach ($entry in $manifest) {
            if ([IO.Path]::GetFileName($entry.file) -ne $entry.file -or $entry.sha256 -notmatch '^[0-9a-fA-F]{64}$') {
              throw 'SHA-256 manifest contains an invalid entry.'
            }
            if ($manifestNames.ContainsKey($entry.file)) { throw "Duplicate manifest entry: $($entry.file)." }
            $manifestNames[$entry.file] = $true
            $path = Join-Path $directory $entry.file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Manifest file is missing: $($entry.file)." }
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $entry.sha256) { throw "SHA-256 mismatch: $($entry.file)." }
          }
          $payload = @(Get-ChildItem $directory -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap', '.json' } | Where-Object { $_.Name -ne 'sha256.json' })
          $differences = @(Compare-Object @($manifestNames.Keys | Sort-Object) @($payload.Name | Sort-Object))
          if ($differences.Count -ne 0) { throw 'Downloaded release payload differs from its SHA-256 manifest.' }
      - name: Publish stable release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: false
          files: |
            release/stable/*.exe
            release/stable/latest.yml
            release/stable/*.blockmap
            release/stable/sha256.json
            release/stable/release-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
